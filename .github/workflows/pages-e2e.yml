name: Pages end-to-end check

# Real browser against the published demo: loads the page, searches, and watches
# the live lookup (ntfy relay → fare daemon) stream fares back. Run it by hand
# (workflow_dispatch) after the daemon / page changed.
on:
  push:
    branches: [claude/zealous-darwin-1kexus]
    paths:
      - ".github/workflows/pages-e2e.yml"
      - "smart-flight-finder/backend/scripts/e2e_pages.py"
  workflow_dispatch:
    inputs:
      url:
        default: "https://b8rrs4sydg-cmyk.github.io/TradingStrategy/"
      wait_seconds:
        default: "240"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: smart-flight-finder/backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/zealous-darwin-1kexus
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - run: python -m scripts.e2e_pages "${{ inputs.url || 'https://b8rrs4sydg-cmyk.github.io/TradingStrategy/' }}" "${{ inputs.wait_seconds || '240' }}"
