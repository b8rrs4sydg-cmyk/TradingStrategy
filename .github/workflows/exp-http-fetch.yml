name: Experiment - Google Flights over plain HTTP

# Not part of the product. Question: can fares be read without a browser (about 1 s instead of 10-40 s)?
on:
  push:
    branches: [claude/zealous-darwin-1kexus]
    paths:
      - ".github/workflows/exp-http-fetch.yml"
      - "smart-flight-finder/backend/scripts/exp_http_fetch.py"
      - "smart-flight-finder/backend/scripts/exp_http_inspect.py"
      - "smart-flight-finder/backend/scripts/exp_http_reliability.py"
      - "smart-flight-finder/backend/scripts/exp_mc_probe.py"
      - "smart-flight-finder/backend/scripts/exp_mc_replay.py"
      - "smart-flight-finder/backend/scripts/exp_mc_build.py"
      - "smart-flight-finder/backend/scripts/exp_http_validate.py"
      - "smart-flight-finder/backend/scripts/exp_http_xhr.py"
      - "smart-flight-finder/backend/scripts/exp_http_diag.py"
      - "smart-flight-finder/backend/scripts/exp_http_diag2.py"
      - "smart-flight-finder/backend/app/providers/google_http.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: smart-flight-finder/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . requests "playwright>=1.50,<2"
      - run: playwright install --with-deps chromium
      - run: python -m scripts.exp_http_diag2 ../public/fares.json
