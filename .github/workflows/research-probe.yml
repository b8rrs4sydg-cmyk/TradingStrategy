name: Research probe (temporary)

# One-off: the dev sandbox has no open egress, so read the reference
# articles and open the generated multi-city booking links from a runner.
on:
  push:
    branches: [claude/zealous-darwin-1kexus]
    paths: [".github/probe/**", ".github/workflows/research-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        working-directory: .github/probe
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Probe
        working-directory: .github/probe
        run: node probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-screenshots
          path: .github/probe/*.png
