name: Experiment - why are some multi-city fares missing?

# Not part of the product. A four-leg ticket that Trip.com sells (ICN-TPE-CDG-TPE-ICN) comes back "not on Google Flights";
# this asks the same Google page through HTTP and a browser, next to control keys that do price, and prints what the page says.
on:
  push:
    branches: [claude/zealous-darwin-1kexus]
    paths:
      - ".github/workflows/exp-mc-missing.yml"
      - "smart-flight-finder/backend/scripts/exp_mc_missing.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: smart-flight-finder/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . requests "playwright>=1.50,<2"
      - run: playwright install --with-deps chromium
      - run: python -m scripts.exp_mc_missing
