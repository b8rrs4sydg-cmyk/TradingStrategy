name: Deploy demo to GitHub Pages

# Deploys smart-flight-finder/public/ to the gh-pages branch, which the
# repository already serves (has_pages: true). This path avoids the
# official actions/deploy-pages flow — that one blocks until Pages Source
# is set to "GitHub Actions" in Repository Settings, which this Claude
# GitHub App integration can't flip. Pushing to gh-pages works with just
# the default GITHUB_TOKEN contents:write permission.

on:
  push:
    branches:
      - claude/zealous-darwin-1kexus
      - main
    paths:
      - "smart-flight-finder/public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R smart-flight-finder/public/* _site/
          touch _site/.nojekyll
          test -f _site/index.html
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: ${{ github.event.head_commit.message }}
