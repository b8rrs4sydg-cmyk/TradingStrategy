name: Deploy demo to GitHub Pages

# Pages has already been enabled on this repo (has_pages: true in the REST
# response), so configure-pages should not need to call the "Create Pages
# Site" API (which the Claude GitHub App integration can't call). Setting
# enablement: false avoids that failing call. If the user's Pages Source
# is "GitHub Actions", this deploys. If it's "Deploy from branch", the
# step-5 peaceiris fallback updates the gh-pages branch instead.

on:
  push:
    branches:
      - claude/zealous-darwin-1kexus
      - main
    paths:
      - "smart-flight-finder/public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R smart-flight-finder/public/* _site/
          touch _site/.nojekyll
          test -f _site/index.html

      # Keep the gh-pages branch fresh so if Pages Source is "Deploy from
      # branch gh-pages", the push alone makes the site live.
      - name: Fallback — push to gh-pages branch
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: ${{ github.event.head_commit.message }}

      # Primary path — Pages Source = "GitHub Actions".
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true
        with:
          enablement: false

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: _site

      - name: Deploy
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Verify live Pages URL
        env:
          URL: https://b8rrs4sydg-cmyk.github.io/TradingStrategy/
        run: |
          set +e
          attempt=0
          code=0
          while [ "$attempt" -lt 15 ]; do
            attempt=$((attempt + 1))
            code="$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 15 "$URL")"
            echo "attempt $attempt → HTTP $code"
            [ "$code" = "200" ] && break
            sleep 10
          done
          echo ""
          echo "=== HEAD ==="
          curl -sS -I --max-time 15 "$URL" | tee /tmp/head.txt
          echo ""
          echo "=== BODY (first 400 bytes) ==="
          head -c 400 /tmp/body
          echo ""
          echo ""
          echo "=== Markers ==="
          grep -q "多假期排列組合" /tmp/body && echo "MARKER_MULTI_HOLIDAY: PRESENT" || echo "MARKER_MULTI_HOLIDAY: MISSING"
          grep -q "元旦請 0 休 3"      /tmp/body && echo "MARKER_NYD: PRESENT"         || echo "MARKER_NYD: MISSING"
          grep -q "聖誕請 2 休 5"      /tmp/body && echo "MARKER_XMAS: PRESENT"        || echo "MARKER_XMAS: MISSING"
          echo ""
          if [ "$code" = "200" ]; then
            echo "SUCCESS: Pages site live at $URL"
            exit 0
          else
            echo "WARNING: Pages URL returned HTTP $code"
            echo "Fix: Repository Settings → Pages → Source → Deploy from branch gh-pages / (root) → Save"
            exit 1
          fi
